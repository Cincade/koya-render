name: recap
run-name: recap (${{ inputs.shards }} shards, from ${{ inputs.first }}, part ${{ inputs.part }})

# 7 Nov 2026: all-cloud recap. ONE run renders the board frames AND composites the owner's own talking head (pip.py,
# locked) shard by shard, then joins (stream copy) and adds the Mac's voice + music mix. Nothing big comes back to the
# Mac except the finished video and its WhatsApp copy.
# Manual trigger only: no pull_request triggers, so forks never see RENDER_KEY.
# The job branch holds only encrypted files (footage.part_*, bundle.part_*, audio.enc); everything a runner uploads is
# encrypted too, artifacts live 1 day and the Mac deletes them (and the branch) right after download.
on:
  workflow_dispatch:
    inputs:
      shards: { description: "number of parallel shards (in total, across all farms)", default: "20" }
      first: { description: "first shard this farm runs (8 Nov: one render split across accounts)", default: "0" }
      count: { description: "how many shards this farm runs (empty = all)", default: "" }
      part: { description: "1 = join only this farm's block into a video-only part (the Mac stitches the parts)", default: "0" }

permissions:
  contents: read
  actions: write

env:
  PLAYWRIGHT_VERSION: "1.60.0"   # same as the Mac, so the same Chromium build
  FFMPEG_BUILD: "ffmpeg-n9.0-latest-linux64-gpl-9.0"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env: { N: "${{ inputs.shards }}", F: "${{ inputs.first }}", C: "${{ inputs.count }}" }
        run: echo "matrix=$(python3 -c 'import json, os; f = int(os.environ["F"] or 0); c = int(os.environ["C"] or int(os.environ["N"]) - f); print(json.dumps(list(range(f, f + c))))')" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false   # one slow/failed shard must not cancel the others; the client re-runs failed shards
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ${{ env.FFMPEG_BUILD }}
      - name: tools
        run: bash farm/run.sh recap_tools
      - name: board + composite
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: bash farm/run.sh recap_shard
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.shard }}
          path: ${{ runner.temp }}/enc/chunk_*.tar.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: err-${{ matrix.shard }}
          path: ${{ runner.temp }}/enc/err_*.enc
          retention-days: 1
          if-no-files-found: ignore

  join:
    needs: shard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ${{ env.FFMPEG_BUILD }}
      - name: ffmpeg
        run: bash farm/run.sh ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: ${{ runner.temp }}/parts
          merge-multiple: true
      - name: join (stream copy) + mix + WhatsApp copy
        env:
          RENDER_KEY: ${{ secrets.RENDER_KEY }}
          SHARDS: ${{ inputs.shards }}
          FIRST: ${{ inputs.first }}
          COUNT: ${{ inputs.count }}
          PART: ${{ inputs.part }}
        run: bash farm/run.sh recap_join
      - uses: actions/upload-artifact@v4
        with:
          name: final
          path: ${{ runner.temp }}/final/final.mp4.enc
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp
          path: ${{ runner.temp }}/final/whatsapp.mp4.enc
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore
      - name: delete chunk artifacts
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name | startswith("chunk-")) | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null
          done
